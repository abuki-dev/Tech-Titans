<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <button id="send">Send Message</button>
  <body>
    <script>
      try {
        const serevr = new WebSocket("ws:localhost:8080");
        console.log("conneted to the server");

        const sendbtn = document.getElementById("send");
        sendbtn.addEventListener("click", () => {
          sendmessage(serevr);
        });

        serevr.onmessage = (event) => {
          alert(event.data);
        };
      } catch (error) {
        console.log("Error connecting to teh server ", error.message);
      }
      function sendmessage(wsss) {
        wsss.send("hellow serevr Im client one");
      }
    </script>
  </body>
</html>
