<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Client Dashboard</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center py-10 px-4">

    <!-- Dashboard Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-black tracking-wider text-emerald-400 mb-2">WebSocket Control Center</h1>
      <p class="text-slate-400 text-sm">Spawn and manage active real-time client sockets dynamically</p>
    </header>

    <!-- Main Container -->
    <div id="Cilients" class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
      <button id="create_clinet" class="w-full py-3.5 px-6 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold tracking-wide transition-all duration-200 shadow-lg shadow-emerald-500/20 active:scale-[0.99] cursor-pointer">
        + Create New Client
      </button>
      <div class="border-b border-slate-800 my-2"></div>
    </div>

    <script src="./script.client.js"></script>
  </body>
</html>
