<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <h1>Add user</h1>
        <p class="lead">
          Create a new user. The username is generated from the email.
        </p>

        <form
          id="postUsersForm"
          action="/users/register"
          method="post"
          novalidate
        >
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <button type="submit" class="btn primary">Create user</button>
        </form>
      </section>

      <section class="card">
        <h1>Register data source</h1>
        <p class="lead">Choose which set of users to register.</p>

        <form id="getUsersForm" action="/users" method="get">
          <label for="source">User source</label>
          <select id="source" name="mockusers">
            <option value="mock">Mock users</option>
            <option value="real">Real users</option>
          </select>

          <button type="submit" class="btn secondary">Register</button>
        </form>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
