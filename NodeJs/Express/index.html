<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 30%;
      align-items: center;
    }
    h1 {
      border: solid;
      border-radius: 10px;
      font-family: sans-serif;
      padding: 15px;
    }
  </style>
  <body>
    <h1>Hellow World This is My first Express app</h1>
    <form id="get"><button type="submit">Get message</button></form>
  </body>
  <script>
    let button = document.getElementById("get");
    button.addEventListener("submit", (ev) => {
      ev.preventDefault();
      fetch("/message/new")
        .then((respons) => respons.json())
        .then((data) => {
          console.log(data);
        });
    });
  </script>
</html>
